# main への push でサイトをビルドし、GitHub Pages に公開する。
# Pages の公開元（Settings → Pages → Source）は「GitHub Actions」にしておくこと。
# （公開用ブランチに push する方式は、GITHUB_TOKEN による push では Pages の公開処理が起動しないため使わない）
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 連続して push されたときは、最新のビルドだけを公開する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # ubuntu-latest は移行期間中に警告が出るため、バージョンを固定する
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
